[project]
name = "momato"
version = "0.1.0"
description = "Internal project management: projects across an organisation tree, planning, timesheets and people planning."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pyspnego>=0.12.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
    "xlsxwriter>=3.2.9",
]

[project.optional-dependencies]
mssql = [
    "pyodbc>=5.3.0",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.0",
]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["design_handoff_kite_pm_tool"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # modern syntax
    "SIM", "C4", "RET", "PTH",
    "N",             # naming
    "S",             # security (bandit)
    "RUF",
    "D100", "D104",  # every module and package has a docstring (feeds docs/CODEMAP.md)
]

# Typographic characters used on purpose: breadcrumb ›, ranges 2–10, ’25, × and − in rule texts.
allowed-confusables = ["›", "–", "’", "×", "−"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "E501"]  # asserts, literals, long lines
"momato/db/migrations/versions/**" = ["D100", "E501"]  # generated

[tool.pyright]
include = ["momato", "tests", "scripts", "app.py"]
exclude = ["**/__pycache__", "design_handoff_kite_pm_tool", ".venv"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["momato"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Browser, scale and visual tests are opt-in: `-m e2e`, `-m scale`, `-m visual`.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not e2e and not scale and not visual"]
markers = [
    "e2e: browser tests driven by Playwright (slow; need `playwright install chromium`)",
    "scale: budget tests on the scale data set (REQUIREMENTS 8.5; run before releases)",
    "visual: screenshot comparisons (opt-in)",
    "requires_sqlite: about SQLite itself; skipped when MOMATO_TEST_DATABASE_URL is another database",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["momato"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true

# ---------------------------------------------------------------- architecture contracts
# Checked by `lint-imports` and by tests/architecture/test_structure.py.

[tool.importlinter]
root_package = "momato"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: each layer only imports the layers below it"
type = "layers"
layers = [
    "momato.cli",
    "momato.web",
    "momato.api",
    "momato.services",
    "momato.schemas",
    "momato.identity",
    "momato.db",
    "momato.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure Python: no framework, no persistence, no config"
type = "forbidden"
source_modules = ["momato.domain"]
forbidden_modules = ["momato.config", "sqlalchemy", "fastapi", "starlette", "pydantic"]

[[tool.importlinter.contracts]]
name = "Routers never touch the database directly: they call services"
type = "forbidden"
source_modules = ["momato.api.routers"]
forbidden_modules = ["momato.db", "sqlalchemy"]
allow_indirect_imports = true  # routers call services, which of course use the database
